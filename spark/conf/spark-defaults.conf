# Configuracion compartida por los jobs de Spark (local[*], emulando Databricks
# con soporte Delta Lake). Aplica tanto al contenedor "spark-streaming" como a
# cualquier spark-submit ejecutado desde el contenedor de Airflow.

spark.sql.extensions          io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog org.apache.spark.sql.delta.catalog.DeltaCatalog

# Necesario para que una SparkSession embebida (sin pasar por
# spark-submit --packages) resuelva el jar de Delta via Ivy al arrancar.
# Esto es lo que usa dbt-spark con method=session (ver dbt_project/profiles.yml).
spark.jars.packages            io.delta:delta-spark_2.12:3.2.0

spark.sql.session.timeZone    UTC
spark.sql.shuffle.partitions  4

spark.driver.memory            1g
